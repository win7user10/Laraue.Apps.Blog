# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Pack Blog Api Host
      if: github.ref == 'refs/heads/main'
      run: tar -czf blog-api-host.tar.gz -C src/Laraue.Apps.Blog.ApiHost/bin/Release/net10.0 .

    - name: Upload Blog Api Host artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: blog-api-host
        path: blog-api-host.tar.gz
        retention-days: 7

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: blogapi-production
    steps:
    - name: Notify deploy started
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="🚀 Deploy started: Blog Api Host (${{ github.sha }})"

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: blog-api-host

    - name: Upload host
      uses: marcodallasanta/ssh-scp-deploy@v1.2.0
      with:
       host: ${{ secrets.SSH_HOST }} # "example.com"
       port: ${{ secrets.SSH_PORT }} # 22
       user: ${{ secrets.SSH_USER }} # "user"
       password: ${{ secrets.SSH_PASSWORD }} # "password"
       local: blog-api-host.tar.gz
       remote: "/home/laraue/backend-blog"
       post_upload: |-
        cd /home/laraue/backend-blog && find . -mindepth 1 ! -name blog-api-host.tar.gz -delete &&
        tar -xzf blog-api-host.tar.gz && rm blog-api-host.tar.gz

    - name: Build container
      uses: appleboy/ssh-action@v1
      with:
       host: ${{ secrets.SSH_HOST }}
       port: ${{ secrets.SSH_PORT }}
       username: ${{ secrets.SSH_USER }}
       password: ${{ secrets.SSH_PASSWORD }}
       script: |
        set -e
        cd /home/laraue && docker compose build blogapihost
        docker compose up -d --force-recreate blogapihost

    - name: Notify deploy finished
      if: success()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="✅ Deploy finished: Blog Api Host (${{ github.sha }})"

    - name: Notify deploy failed
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="❌ Deploy failed: Blog Api Host (${{ github.sha }})"
